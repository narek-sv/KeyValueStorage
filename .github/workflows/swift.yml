name: Build & Test  
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
        matrix:
          include:
            # The oldest supported version, Swift 6.0
            - os: macos-15
              xcode: Xcode_16
            # The latest Xcode on the runners
            - os: macos-26
              xcode: Xcode_26.6
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - name: Get Swift version
      run: swift --version
    - uses: actions/checkout@v4
      name: Checkout
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v --enable-code-coverage
    - name: Upload to Codecov
      uses: codecov/codecov-action@v3
