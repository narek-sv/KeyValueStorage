name: Build & Test  
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # A hanging test fails the job instead of running until GitHub's limit of 6 hours
    timeout-minutes: 30
    strategy:
        # Finish every job, so a failure on one Xcode doesn't hide the result of another
        fail-fast: false
        matrix:
          # One Xcode for each Swift version, from the oldest supported one to the latest on the runners
          include:
            - os: macos-15
              xcode: Xcode_16       # Swift 6.0
            - os: macos-15
              xcode: Xcode_16.4     # Swift 6.1
            - os: macos-26
              xcode: Xcode_26.0.1   # Swift 6.2
            - os: macos-26
              xcode: Xcode_26.6     # Swift 6.3
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - name: Get Swift version
      run: swift --version
    - uses: actions/checkout@v4
      name: Checkout
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v
      env:
        # Print the crashed thread when a test crashes
        SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed
    - name: Show crash reports
      if: failure()
      run: cat ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null || echo "No crash reports"

  platforms:
    # The other platforms with the latest Xcode; the iOS Simulator follows iOS rules, such as for file names
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
    - uses: actions/checkout@v4
      name: Checkout
    - name: Choose an iOS Simulator
      run: |
        # The first iPhone of the newest iOS, since the installed simulators differ between runner images
        echo "DEVICE=$(xcrun simctl list devices available --json | jq -r '.devices | to_entries | map(select(.key | test("SimRuntime\\.iOS-"))) | sort_by(.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]) | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')" >> "$GITHUB_ENV"
    - name: Test on the iOS Simulator
      run: xcodebuild test -scheme KeyValueStorage -destination "platform=iOS Simulator,id=$DEVICE"
    - name: Test the keychain in a host app on the iOS Simulator
      # Only an app can have the keychain entitlements, so these tests run in Tests/KeychainHost
      run: xcodebuild test -project Tests/KeychainHost/KeychainHost.xcodeproj -scheme KeychainHost -destination "platform=iOS Simulator,id=$DEVICE"
    - name: Build for tvOS
      run: xcodebuild build -scheme KeyValueStorage -destination "generic/platform=tvOS"
    - name: Build for watchOS
      run: xcodebuild build -scheme KeyValueStorage -destination "generic/platform=watchOS"
    - name: Show crash reports
      if: failure()
      run: cat ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null || echo "No crash reports"
